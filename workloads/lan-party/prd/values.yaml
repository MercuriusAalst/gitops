# Production overrides. Everything not listed here comes from the chart's own
# values.yaml. Image tags and the chart version only ever change here through a
# merged promotion PR.

hosts:
  frontend: lan.mercurius-aalst.be
  backend: api.mercurius-aalst.be

externalSecrets:
  secretStore:
    name: mercurius-prd
    kind: ClusterSecretStore

postgres:
  storage:
    size: 10Gi

backend:
  image:
    tag: "0.5.2"
  storage:
    size: 10Gi

frontend:
  image:
    tag: "0.4.0"
