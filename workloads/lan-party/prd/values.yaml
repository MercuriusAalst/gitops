# Production overrides. Everything not listed here comes from the chart's own
# values.yaml. Image tags and the chart version only ever change here through a
# merged promotion PR.

hosts:
  frontend: lan.mercurius-aalst.be
  backend: api.mercurius-aalst.be
externalSecrets:
  secretStore:
    name: mercurius-prd
    kind: ClusterSecretStore
postgres:
  storage:
    size: 10Gi
backend:
  image:
    tag: "0.9.0"
  storage:
    size: 10Gi
  config:
    # Prd reuses dev's Auth0 tenant setup, API identifier included.
    Mercurius.LAN.API_Auth0__Audience: https://devapi.mercurius-aalst.be
frontend:
  image:
    tag: "0.8.3"
  config:
    Auth0__Audience: https://devapi.mercurius-aalst.be
