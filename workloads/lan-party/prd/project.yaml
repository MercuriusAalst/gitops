apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    # Before every Application, which would otherwise reference a project that
    # does not exist yet on the first sync.
    argocd.argoproj.io/sync-wave: "-100"
  name: lan-party-prd
  namespace: argocd
spec:
  description: Mercurius LAN party, prd environment.
  sourceRepos:
    - ghcr.io/mercuriusaalst/charts
    - https://github.com/MercuriusAalst/gitops
  destinations:
    - server: https://kubernetes.default.svc
      namespace: mercurius-prd
  # Namespace only, for CreateNamespace=true. The lan-party chart renders
  # namespaced resources only; a chart change that starts creating other
  # cluster-scoped objects fails here instead of quietly gaining cluster-wide
  # reach.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
