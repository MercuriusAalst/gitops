apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  annotations:
    # Reads its token through the mercurius-prd store, so after
    # external-secrets; independent of the database chain.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  source:
    # Cloudflare's own cloudflare-tunnel-remote chart only takes the tunnel token
    # as a plain value, which would put it in this repo. app-template runs the
    # same connector and lets the token come from an ExternalSecret instead.
    repoURL: ghcr.io/bjw-s-labs/helm
    chart: app-template
    targetRevision: 5.2.1
    helm:
      releaseName: cloudflared
      values: |
        # The tunnel is remotely managed: its public hostnames and the services
        # they route to live in the Zero Trust dashboard, not here. This only
        # runs the connector, which dials out, so nothing listens on the node.
        controllers:
          cloudflared:
            # Two connectors, so a rollout or a crashed pod never drops the tunnel.
            replicas: 2
            strategy: RollingUpdate
            pod:
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                seccompProfile:
                  type: RuntimeDefault
            containers:
              app:
                image:
                  repository: cloudflare/cloudflared
                  tag: 2026.9.3
                # The image's entrypoint is `cloudflared --no-autoupdate`.
                args: [tunnel, --metrics, 0.0.0.0:2000, run]
                env:
                  TUNNEL_TOKEN:
                    valueFrom:
                      secretKeyRef:
                        name: cloudflared
                        key: TUNNEL_TOKEN
                # /ready is 200 once the connector holds at least one
                # connection to Cloudflare's edge.
                probes:
                  readiness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /ready
                        port: 2000
                      periodSeconds: 10
                  liveness:
                    enabled: true
                    custom: true
                    spec:
                      httpGet:
                        path: /ready
                        port: 2000
                      initialDelaySeconds: 30
                      periodSeconds: 20
                      failureThreshold: 3
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: [ALL]
                resources:
                  requests:
                    cpu: 10m
                    memory: 64Mi
                  limits:
                    memory: 256Mi
        rawResources:
          tunnel-token:
            forceRename: cloudflared
            manifest:
              apiVersion: external-secrets.io/v1
              kind: ExternalSecret
              spec:
                refreshInterval: 1h
                # One tunnel serves dev and prd, so its token lives with prd:
                # Infisical project cluster, environment prd.
                secretStoreRef:
                  name: mercurius-prd
                  kind: ClusterSecretStore
                target:
                  name: cloudflared
                  creationPolicy: Owner
                data:
                  - secretKey: TUNNEL_TOKEN
                    remoteRef:
                      # Leading slash: an absolute Infisical path, overriding
                      # the store's /lan-party default.
                      key: /cloudflared/TUNNEL_TOKEN
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
