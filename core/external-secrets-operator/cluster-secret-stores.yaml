# One store per environment, each pinned to its own Infisical environment, so
# dev can never read production's secrets by naming the wrong key.
#
# Both log in with one Universal Auth machine identity (Viewer on the project).
# ponytail: Infisical free tier has no environment-scoped roles, so that identity
# can read dev and prd alike; the namespace conditions below are what keep them
# apart. Split into one project per environment if that stops being enough.
# Its credentials are the only secret created by hand:
#   kubectl -n external-secrets create secret generic infisical-universal-auth \
#     --from-literal=clientId=<client-id> --from-literal=clientSecret=<client-secret>
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: mercurius-dev
  annotations:
    # The CRD comes from the external-secrets-operator Application; on a fresh
    # cluster it does not exist yet when bootstrap first syncs.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Only the dev namespace may use the dev store.
  conditions:
    - namespaces:
        - mercurius-dev
  provider:
    infisical:
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      hostAPI: https://eu.infisical.com/api
      secretsScope:
        projectSlug: cluster-w-xun
        environmentSlug: dev
        secretsPath: /lan-party
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: mercurius-prd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  conditions:
    - namespaces:
        - mercurius-prd
        # The tunnel serves both environments; its token lives with prd.
        - cloudflared
  provider:
    infisical:
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      hostAPI: https://eu.infisical.com/api
      secretsScope:
        projectSlug: cluster-w-xun
        environmentSlug: prd
        secretsPath: /lan-party
