apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
spec:
  project: core
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.18
    helm:
      values: |
        reloader:
          # Annotate the pod template instead of injecting an env var, so the
          # restart trigger stays out of the container spec Argo CD owns.
          reloadStrategy: annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
